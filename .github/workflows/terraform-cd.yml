name: Terraform CD (Azure)

# =============================================================================
# Plans Terraform changes on pull requests touching infrastructure/terraform,
# and applies them on merge to main -- gated by a GitHub Environment that
# requires manual approval. Authenticates to Azure via OIDC (no client
# secret stored in GitHub).
#
# Required one-time setup (see infrastructure/README.md "CD setup"):
#   - An Azure AD App Registration + federated credential for OIDC, scoped
#     to this repo/environment.
#   - Repository/organization VARIABLES (not secrets, these are not sensitive):
#       AZURE_CLIENT_ID        - the OIDC app registration's client ID
#       AZURE_TENANT_ID        - d11cdc76-c6f2-4368-a98f-498e78a7e011
#       AZURE_SUBSCRIPTION_ID  - 8fcc5e8e-6540-4288-89e7-849e94290205
#       TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT, TF_STATE_CONTAINER
#         - the pre-provisioned remote state backend for `terraform init`
#   - A GitHub Environment named "infra-dev-approval" with required
#     reviewers configured, used to gate the apply job.
#   - No AZURE_CLIENT_SECRET is used or required -- OIDC federation only.
# =============================================================================

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev or prod)"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

permissions:
  id-token: write # required for OIDC federation to Azure
  contents: read
  pull-requests: write # to comment the plan output on the PR

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  # Force the environment's tenant_id/subscription_id Terraform variables to
  # match the OIDC-authenticated identity above, so a stale hardcoded default
  # in variables.tf can never silently point the azurerm provider at the
  # wrong tenant/subscription (which manifests as an opaque AADSTS53003).
  TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  TF_WORKING_DIR: infrastructure/terraform/environments/${{ github.event.inputs.environment || 'dev' }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Configure Key Vault deployment access
        shell: bash
        run: |
          # GitHub-hosted runners egress through a pool of IPs that can change
          # between requests within the same job, so allow-listing a single
          # captured IP is unreliable (leads to transient 403 ForbiddenByFirewall
          # errors). For this demo/dev environment, temporarily open the Key
          # Vault firewall for the duration of the apply instead.
          printf 'TF_VAR_key_vault_public_network_access_enabled=true\n' >> "$GITHUB_ENV"
          printf 'TF_VAR_key_vault_network_acls_default_action=Allow\n' >> "$GITHUB_ENV"
          printf 'TF_VAR_grant_deployer_key_vault_secret_officer=true\n' >> "$GITHUB_ENV"
          printf 'TF_VAR_postgres_public_access_allow_all_azure_ips=true\n' >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=taskify-${{ env.TF_ENVIRONMENT }}.tfstate"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### Terraform Plan (\`${process.env.TF_ENVIRONMENT}\`)
            \`\`\`
            ${process.env.PLAN}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: []
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: infra-dev-approval # requires manual approval before running
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Configure Key Vault deployment access
        shell: bash
        run: |
          # GitHub-hosted runners egress through a pool of IPs that can change
          # between requests within the same job, so allow-listing a single
          # captured IP is unreliable (leads to transient 403 ForbiddenByFirewall
          # errors). For this demo/dev environment, temporarily open the Key
          # Vault firewall for the duration of the apply instead.
          printf 'TF_VAR_key_vault_public_network_access_enabled=true\n' >> "$GITHUB_ENV"
          printf 'TF_VAR_key_vault_network_acls_default_action=Allow\n' >> "$GITHUB_ENV"
          printf 'TF_VAR_grant_deployer_key_vault_secret_officer=true\n' >> "$GITHUB_ENV"
          printf 'TF_VAR_postgres_public_access_allow_all_azure_ips=true\n' >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=taskify-${{ env.TF_ENVIRONMENT }}.tfstate"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          # Terraform refreshes existing resources' state (including reading
          # Key Vault secrets already in state) before computing/applying any
          # changes -- including the firewall change that would let those
          # reads succeed. Skip the refresh so the firewall update is applied
          # first; a normal apply afterwards (next run) will true up drift.
          terraform apply -auto-approve -input=false -refresh=false
